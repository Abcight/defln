[package]
name = "sodglumate-rs"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
video = ["dep:egui-player-rs"]

[dependencies]
egui-player-rs = { path = "../egui-player-rs", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", features = ["jpeg", "png", "webp", "gif"] }
egui_extras = { version = "0.29.1", features = ["all_loaders"] }
anyhow = "1.0"
log = "0.4"
rand = "0.9.2"
indexmap = "2.13.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.15"
directories = "6.0.0"
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
env_logger = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.0", features = ["full"] }
toml = "0.8.19"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow", "persistence"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1.0", default-features = false, features = ["sync"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Performance", "Storage", "Window"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
