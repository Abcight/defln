	{ at_ms = 4000, command = { type = "next" } },
	{ at_ms = 4300, command = { type = "next" } },
	{ at_ms = 4600, command = { type = "next" } },
	{ at_ms = 4900, command = { type = "next" } },

	# Jump past a run of uninteresting results, then inspect a couple more.
